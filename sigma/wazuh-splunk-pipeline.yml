name: Lab Wazuh JSON alerts in Splunk
priority: 100
allowed_backends:
  - splunk
transformations:
  - id: lab_source
    type: add_condition
    conditions:
      index: wazuh
      sourcetype: wazuh:alert:json
      agent.name: WIN-ENDPOINT
  - id: sysmon_process_source
    type: add_condition
    conditions:
      data.win.system.eventID: 1
      data.win.system.providerName: Microsoft-Windows-Sysmon
    rule_conditions:
      - type: logsource
        category: process_creation
        product: windows
  - id: security_provider
    type: add_condition
    conditions:
      data.win.system.providerName: Microsoft-Windows-Security-Auditing
    rule_conditions:
      - type: logsource
        service: security
        product: windows
  - id: windows_field_mapping
    type: field_name_mapping
    mapping:
      EventID: data.win.system.eventID
      Image: data.win.eventdata.image
      CommandLine: data.win.eventdata.commandLine
